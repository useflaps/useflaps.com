<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    path, rect {
      stroke: #0f172a;
      fill: none;
    }
    .accent {
      fill: #0284c7;
    }
    @media (prefers-color-scheme: dark) {
      path, rect {
        stroke: #f8fafc;
      }
      .accent {
        fill: #38bdf8;
      }
    }
  </style>
  
  <!-- 雙層舷窗物理輪廓 (非正方形，全透明外圈) -->
  <rect x="7" y="3" width="18" height="26" rx="9" stroke-width="2.2" />
  <rect x="10" y="6" width="12" height="20" rx="6" stroke-width="1.4" opacity="0.4" />
  
  <!-- 內層微小洩壓通氣孔 (Bleed Hole) 航空真實細節 -->
  <circle cx="16" cy="22" r="0.9" class="accent" />
</svg>